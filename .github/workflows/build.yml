name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # nécessaire pour publier une release

jobs:
  test-core:
    name: Test du moteur de rendu (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -O2 -Wall -Wextra tests/render_test.cpp -o render_test
      - run: ./render_test samples/test.glb

  windows:
    name: DLL + installateur (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compiler la DLL
        shell: cmd
        run: scripts\build.bat
      - name: Installateur + archive portable
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.0.0-dev' }
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$v" installer\installer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item LICENSE build\
          Compress-Archive -Path build\GlbThumbnail.dll, build\install.bat, build\uninstall.bat, build\LICENSE `
            -DestinationPath "dist\GlbThumbnail_Portable_x64_$v.zip"
          Push-Location dist
          Get-FileHash -Algorithm SHA256 *.exe, *.zip | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt
          Pop-Location
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      - name: Publier la release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
